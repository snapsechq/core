name: CI & Publish to GitHub Packages

on:
  push:
    branches:
      - master
    tags:
      - "*-v*.*.*"
  pull_request:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Tests
        run: pnpm test

  publish:
    name: Publish to GitHub Packages
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://npm.pkg.github.com"
          scope: "@snapsechq"

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Extract Target Package and Publish
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          PACKAGE_NAME="${TAG_NAME%%-v*}"
          
          echo "Targeting package: packages/${PACKAGE_NAME}"
          
          if [ ! -d "packages/${PACKAGE_NAME}" ]; then
            echo "Error: Directory packages/${PACKAGE_NAME} does not exist."
            exit 1
          fi
          
          cd "packages/${PACKAGE_NAME}"
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
