name: CI & Publish to GitHub Packages

on:
  push:
    branches:
      - master
    tags:
      - "*-v*.*.*"
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - authentication
          - authorization
          - rabbitmq

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Tests
        run: pnpm test

  publish:
    name: Publish to GitHub Packages
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://npm.pkg.github.com"
          scope: "@snapsechq"

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish Packages
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SELECTED="${{ inputs.package }}"
            if [ "$SELECTED" = "all" ]; then
              echo "Publishing all packages..."
              pnpm -r publish --no-git-checks
            else
              echo "Publishing packages/$SELECTED..."
              cd "packages/$SELECTED"
              npm publish
            fi
          else
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            PACKAGE_NAME="${TAG_NAME%%-v*}"
            echo "Targeting package from tag: packages/${PACKAGE_NAME}"
            cd "packages/${PACKAGE_NAME}"
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
